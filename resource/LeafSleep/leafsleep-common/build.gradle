plugins {
    id 'java-library'
}

version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    api project(':server-api')
    api project(':database-api')
    api project(':yaml-api')
    api project(':units-api')
    api project(':bit-api')
    api project(':config-bit-api')
    api project(':commands-api')
    api project(':menu-api')
    api project(':effects-api')
    api project(':predict-api')

    compileOnly 'org.xerial:sqlite-jdbc:3.45.1.0'
    testImplementation 'org.xerial:sqlite-jdbc:3.45.1.0'
}

test {
    useJUnitPlatform()
}
